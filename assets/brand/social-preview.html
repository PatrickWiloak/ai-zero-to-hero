<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000}
  .card{width:1280px;height:640px;box-sizing:border-box;padding:0 84px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse 620px 420px at 100% 0%, rgba(220,38,38,0.22), transparent 70%), #000;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#fff}
  .kicker{position:absolute;top:112px;font-family:"DejaVu Sans Mono",monospace;font-size:24px;letter-spacing:6px;color:#ef4444;font-weight:700}
  h1{position:absolute;top:150px;margin:0;font-size:92px;line-height:1.02;font-weight:800;letter-spacing:-2px}
  h1 .a{color:#ef4444}
  .sub{position:absolute;top:372px;font-size:30px;color:#a3a3a3}
  .rule{position:absolute;top:436px;width:112px;height:4px;background:#dc2626;border-radius:2px}
  .chips{position:absolute;top:474px;display:flex;gap:14px}
  .chip{border:1px solid #333;border-radius:28px;padding:12px 22px;font-size:20px;font-weight:700;background:#0a0a0a}
  .url{position:absolute;bottom:52px;font-family:"DejaVu Sans Mono",monospace;font-size:19px;color:#a3a3a3}
  .brand{position:absolute;bottom:52px;right:84px;font-family:"DejaVu Sans Mono",monospace;font-size:19px;color:#666}
</style></head>
<body><div class="card">
  <div class="kicker">FREE &amp; OPEN SOURCE</div>
  <h1>AI, from zero<br><span class="a">to hero</span></h1>
  <div class="sub">98 guides. 156 papers. 31 explainers. Free.</div>
  <div class="rule"></div>
  <div class="chips"><div class="chip">Learn</div><div class="chip">AI at Work</div><div class="chip">Build</div><div class="chip">Tools</div><div class="chip">Safety</div><div class="chip">Careers</div></div>
  <div class="url">ai.noblerworks.com</div>
  <div class="brand">Nobler Works</div>
</div></body></html>
